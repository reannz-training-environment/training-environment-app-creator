# Releases the version that submit.yml.erb pins.
#
# A session runs the image tag written in submit.yml.erb. When a push to main
# pins a version that has no git tag yet, this tags that commit and builds the
# image for it. So releasing is: change the tag in submit.yml.erb (the app
# creator does this when the app spec's version changes) and merge to main.
# Generated by training-environment-app-creator.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Tag and build the pinned version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(grep -oE "${image}:v[0-9A-Za-z._-]+" submit.yml.erb | head -n 1 | sed 's/.*://')
          if [ -z "${version}" ]; then
            echo "::notice::submit.yml.erb does not pin a v* tag of ${image}; nothing to release"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
            echo "${version} is already released"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${version}" -f sha="${GITHUB_SHA}" > /dev/null
          # a tag created with the workflow's token starts no workflows of its
          # own, so start the image build for it explicitly
          gh workflow run build_container.yml --ref "${version}"
          echo "::notice::released ${version}: tagged ${GITHUB_SHA} and started the image build"
