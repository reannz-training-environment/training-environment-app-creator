# Builds this app's image and pushes it to ghcr.io, tagged with the branch or
# tag name. Generated by training-environment-app-creator.
name: Create and publish a Docker image

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Open OnDemand's dashboard reads form.yml with `YAML.safe_load(contents)` and
  # no `aliases: true`. Anything it cannot parse takes the app off the dashboard
  # entirely - no error, no broken tile, the workshop is simply not there.
  check-app-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: form.yml and manifest.yml must parse the way OnDemand parses them
        run: |
          ruby -ryaml -e '
            fail = false
            %w[form.yml manifest.yml].each do |f|
              begin
                YAML.safe_load(File.read(f))
                puts "ok: #{f}"
              rescue => e
                puts "::error file=#{f}::#{e.class}: #{e.message}"
                puts "  The dashboard uses safe_load, so the app would not appear at all."
                puts "  YAML anchors and aliases are the usual cause - write the value out in full."
                fail = true
              end
            end
            exit 1 if fail
          '

  # Open OnDemand renders the template scripts into the job directory keeping
  # their mode, then runs them, so a script committed without its executable
  # bit fails at session launch with "Permission denied".
  check-template-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: template scripts must be executable
        run: |
          fail=0
          for f in $(git ls-files template | grep -E '\.erb$|^template/bin/'); do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is mode $mode, expected 100755."
              echo "  Fix with: git update-index --chmod=+x $f"
              fail=1
            else
              echo "ok: $f is $mode"
            fi
          done
          exit $fail

  # The image tag in submit.yml.erb is what a deployed session actually runs.
  # On a release tag it must be this release, or the cluster silently runs an
  # older image.
  check-submit-image-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: submit.yml.erb must pin this release's tag
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          pinned=$(grep -oE "${image}:[A-Za-z0-9._-]+" submit.yml.erb | head -n 1 | sed 's/.*://')
          echo "git tag            : ${GITHUB_REF_NAME}"
          echo "submit.yml.erb pins: ${pinned}"
          if [ "${pinned}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error file=submit.yml.erb::pins ${pinned} but this release is ${GITHUB_REF_NAME}."
            echo "  A session would run the wrong image. Update the image: line and re-tag."
            exit 1
          fi
          echo "ok: they match"

  build-and-push-image:
    needs: [check-app-config, check-template-permissions, check-submit-image-tag]
    # run when the checks passed, or were skipped (the tag check only runs on tags)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # images with PyTorch, conda or R packages need more disk than a runner has free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A new package on ghcr.io is public only if the organisation allows public
      # packages and this repository is public; otherwise it is private, and
      # there is no API to change that. The training environment pulls images
      # without credentials, so it can only use a public one.
      - name: The image must be public for the training environment to pull it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          settings="https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}/settings"
          visibility=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}" --jq .visibility 2> /dev/null || echo unknown)
          if [ "${visibility}" = "public" ]; then
            echo "ok: the image is public"
          else
            echo "::warning::The image is ${visibility}, and the training environment can only pull public images. Make it public once, at ${settings} (Danger Zone, Change visibility)."
          fi
