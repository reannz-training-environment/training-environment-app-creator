# A REANNZ training environment app, from the app creator website.
# Merging it creates, or updates, one repository per interface:
#   training-environment-jupyter-test2-app
#   training-environment-rstudio-test2-app
#   training-environment-codeserver-test2-app
# Every field is described in https://github.com/reannz-training-environment/training-environment-app-creator/blob/main/schema/app.schema.json
schema_version: 1
name: test2
title: test2
description: test2
version: 0.1.0
interfaces:
  - jupyter
  - rstudio
  - codeserver
resources:
  cpu: 4
  memory_gb: 8
  wall_time_hours:
    default: 8
    min: 4
    max: 12
features:
  gpu:
    enabled: true
    mode: choose
    cards:
      - l4
      - a100_40
      - a100
      - h100
      - pro_6000
    vram: 200MiB
    pytorch: true
    numba: true
    session_form: false
  slurm:
    enabled: true
  lmod:
    enabled: true
software:
  conda:
    channels:
      - conda-forge
      - bioconda
    packages:
      - samtools
      - snakemake
  pip:
    - numpy
    - pandas
    - matplotlib
    - scipy
    - scikit-learn
    - seaborn
    - plotly
    - ipywidgets
  apt:
    - parallel
    - pigz
  r:
    cran:
      - tidyverse
      - ggplot2
    bioconductor:
      - DESeq2
      - edgeR
  vscode_extensions:
    - ms-python.python
    - ms-toolsai.jupyter
advanced:
  rstudio_image: rocker/rstudio
  r_version: 4.5.3
