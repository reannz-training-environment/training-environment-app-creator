# Turns an app request into a pull request.
#
# The app creator website files each request as an issue made with the
# "Request an app" form. Once a maintainer has accepted it, by labelling it
# "request approved", this checks the spec, commits it as apps/<name>.yml on
# the branch app-request/<issue number>, and opens a pull request. Before
# then, it asks the reviewers in config/defaults.yml to accept it. (With
# request_approval: outsiders there, members of the organisation and its
# outside collaborators need no label.) Validate then test-builds the app's
# images, and once they all build, asks the reviewers to review it. Merging
# it is the approval: Publish then makes the app.
#
# To try a request again, run this workflow by hand with its issue number
# (Actions, Request, Run workflow); that also approves it.
#
# It acts as the app creator's GitHub App, since a pull request opened with
# GITHUB_TOKEN would start no checks.
name: Request

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "The request to try again: its issue number"
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: request-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '### App spec') &&
      (github.event.action != 'labeled' || github.event.label.name == 'request approved'))
    runs-on: ubuntu-latest
    steps:
      # main's code, never the request's: the issue only supplies data
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Get a token from the GitHub App
        id: app-token
        if: vars.APP_CREATOR_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CREATOR_CLIENT_ID }}
          private-key: ${{ secrets.APP_CREATOR_APP_PRIVATE_KEY }}
          # this repository only, and only what opening a pull request needs
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # GitHub hides private members of the organisation from the event, so
      # their requests look like outsiders'. A token that can read the members
      # sees them. It needs the App's Members permission; without it, this step
      # fails and only reviewers and people with write access are recognised.
      - name: Get a token that can see who is in the organisation
        id: members-token
        if: vars.APP_CREATOR_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CREATOR_CLIENT_ID }}
          private-key: ${{ secrets.APP_CREATOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-members: read

      - name: Open or update the pull request
        env:
          APP_CREATOR_TOKEN: ${{ steps.app-token.outputs.token }}
          MEMBERS_TOKEN: ${{ steps.members-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "${ISSUE}" ]; then
            python -m te_app_creator request --issue "${ISSUE}" --approved
          else
            python -m te_app_creator request --event "${GITHUB_EVENT_PATH}"
          fi
