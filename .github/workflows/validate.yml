# Checks a pull request before it is merged:
#
# * the generator's tests pass and every app spec is valid
# * the image of every app the pull request adds or changes builds - each image
#   runs its own smoke test of every feature as part of the build
# * when the generator, its templates or its config change, the examples are
#   built instead, since every app is affected
#
# It comments on the pull request with what merging it will create or update,
# then, once the images are built, with how much space each of them needs.
#
# For an app request's pull request (branch app-request/<issue>), it then asks
# the reviewers to approve it when every image built, or tells the requester
# when one did not.
name: Validate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      specs:
        description: "Specs to test-build, space separated (default: every example)"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      app_specs: ${{ steps.plan.outputs.app_specs }}
      build_specs: ${{ steps.plan.outputs.build_specs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Test the generator
        run: python -m pytest -q

      - name: Validate every app spec
        run: |
          shopt -s nullglob
          python -m te_app_creator validate apps/*.yml examples/*.yml

      - name: Work out what to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_SPECS: ${{ inputs.specs }}
        run: |
          shopt -s nullglob
          app_specs=""
          build_specs=""
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            build_specs="${INPUT_SPECS:-$(echo examples/*.yml)}"
          else
            changed=$(git diff --name-only --diff-filter=AM "${BASE}" HEAD)
            app_specs=$(echo "${changed}" | grep -E '^apps/[^/]+\.yml$' | xargs || true)
            build_specs="${app_specs}"
            if echo "${changed}" | grep -qE '^(te_app_creator|config|schema)/'; then
              build_specs="${build_specs} $(echo examples/*.yml)"
            fi
          fi
          build_specs=$(echo ${build_specs} | xargs -n1 | sort -u | xargs)
          echo "app_specs=${app_specs}" >> "$GITHUB_OUTPUT"
          echo "build_specs=${build_specs}" >> "$GITHUB_OUTPUT"
          if [ -n "${build_specs}" ]; then
            echo "matrix=$(python -m te_app_creator matrix ${build_specs})" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          fi
          echo "apps in this pull request: ${app_specs:-none}"
          echo "images to build: ${build_specs:-none}"

      - name: Summarise
        if: steps.plan.outputs.app_specs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPECS: ${{ steps.plan.outputs.app_specs }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "## What merging this pull request does"
            echo
            python -m te_app_creator summary ${SPECS} ${BASE:+--base "${BASE}"} || true
            echo
            echo "Each image is being test-built; this comment will then say how much space it needs."
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: steps.plan.outputs.app_specs != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python -m te_app_creator comment --pr "${PR}" --file summary.md

  build:
    needs: check
    if: needs.check.outputs.matrix != '[]' && needs.check.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.matrix) }}
    name: build ${{ matrix.app.repo }}
    steps:
      # images with PyTorch, conda or R packages need more disk than a runner has free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Generate the app
        env:
          SPEC: ${{ matrix.app.spec }}
          INTERFACE: ${{ matrix.app.interface }}
        run: python -m te_app_creator render "${SPEC}" -i "${INTERFACE}" -o build

      - name: form.yml and manifest.yml must parse the way Open OnDemand parses them
        env:
          REPO: ${{ matrix.app.repo }}
        run: |
          ruby -ryaml -e '
            %w[form.yml manifest.yml].each do |f|
              YAML.safe_load(File.read(File.join("build", ENV["REPO"], f)))
              puts "ok: #{f}"
            end
          '

      - uses: docker/setup-buildx-action@v4

      # not pushed: the app's own repository builds and pushes its image. It is
      # loaded into the runner's docker, to measure it.
      - name: Build the image, which runs its smoke test
        uses: docker/build-push-action@v7
        with:
          context: build/${{ matrix.app.repo }}/docker
          push: false
          load: true
          tags: app-creator-ci/${{ matrix.app.repo }}:test
          cache-from: type=gha,scope=${{ matrix.app.repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.repo }}

      - name: Measure the space it needs
        env:
          SPEC: ${{ matrix.app.spec }}
          INTERFACE: ${{ matrix.app.interface }}
          REPO: ${{ matrix.app.repo }}
        run: |
          python -m te_app_creator sizes "${SPEC}" -i "${INTERFACE}" \
            --image "app-creator-ci/${REPO}:test" --json "sizes/${REPO}.json" >> "$GITHUB_STEP_SUMMARY"
          cat "sizes/${REPO}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: sizes-${{ matrix.app.repo }}
          path: sizes/

  # Once every image is built (or has failed to), says how much space each
  # needs: on the pull request, and in the run's summary.
  report:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: sizes-*
          merge-multiple: true
          path: sizes

      - name: Sizes in the run summary
        env:
          SPECS: ${{ needs.check.outputs.build_specs }}
        run: |
          mkdir -p sizes
          python -m te_app_creator summary ${SPECS} --sizes sizes >> "$GITHUB_STEP_SUMMARY" || true

      - name: Sizes on the pull request
        if: needs.check.outputs.app_specs != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SPECS: ${{ needs.check.outputs.app_specs }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "## What merging this pull request does"
            echo
            python -m te_app_creator summary ${SPECS} --sizes sizes --base "${BASE}" || true
            echo
            echo "Every image was test-built by this workflow; see the checks below."
          } > summary.md
          python -m te_app_creator comment --pr "${PR}" --file summary.md

  # An app request goes to the reviewers once all its images build; if one
  # does not, the requester hears about it on their request.
  handoff:
    needs: [check, build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'app-request/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ask for approval, or say what went wrong
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${CHECK}" = "success" ] && [ "${BUILD}" = "success" ]; then
            built=success
          elif [ "${CHECK}" = "failure" ] || [ "${BUILD}" = "failure" ]; then
            built=failure
          else
            built="${BUILD}"
          fi
          python -m te_app_creator handoff --pr "${PR}" --built "${built}" --run-url "${RUN_URL}"
